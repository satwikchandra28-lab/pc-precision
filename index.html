<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Mind AI | Premium AI Workspace</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%236366f1'/><stop offset='100%25' style='stop-color:%23a78bfa'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='68' text-anchor='middle' fill='white' font-size='52' font-weight='bold' font-family='Arial'>A</text></svg>">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <style>
        :root {
            --bg: #000000;
            --bg2: #050510;
            --bg3: #0a0a1a;
            --bg4: #0f0f25;
            --accent: #6366f1;
            --accent2: #818cf8;
            --accent3: #a78bfa;
            --accent-glow: #6366f120;
            --text: #ffffff;
            --text2: #c8c8d0;
            --text3: #888899;
            --border: #1a1a30;
            --border2: #252545;
            --green: #22c55e;
            --red: #ef4444;
            --orange: #f59e0b;
            --cyan: #06b6d4;
            --glass: rgba(10,10,30,0.7);
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        
        body {
            font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
            background:var(--bg); color:var(--text);
            height:100vh; height:100dvh;
            overflow:hidden;
            -webkit-tap-highlight-color:transparent;
        }
        
        /* ===== ULTRA AMBIENT BACKGROUND ===== */
        .universe {
            position:fixed; inset:0; pointer-events:none; z-index:0;
            background:radial-gradient(ellipse at 20% 50%, #6366f108 0%, transparent 50%),
                       radial-gradient(ellipse at 80% 50%, #818cf806 0%, transparent 50%),
                       radial-gradient(ellipse at 50% 0%, #a78bfa05 0%, transparent 40%);
        }
        
        /* Floating particles */
        .particles {
            position:fixed; inset:0; pointer-events:none; z-index:0;
        }
        .particle {
            position:absolute;
            border-radius:50%;
            animation:particleFloat 6s ease-in-out infinite;
            opacity:0.4;
        }
        @keyframes particleFloat {
            0%,100%{transform:translateY(0) scale(1);}
            50%{transform:translateY(-30px) scale(1.3);}
        }
        
        /* Neon grid lines */
        .grid-lines {
            position:fixed; inset:0; pointer-events:none; z-index:0;
            background-image:
                linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
            background-size:40px 40px;
            mask-image:radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 70%);
        }
        
        /* Orbiting rings */
        .ring {
            position:fixed;
            border-radius:50%;
            border:1px solid rgba(99,102,241,0.1);
            pointer-events:none; z-index:0;
            animation:ringRotate 20s linear infinite;
        }
        .ring:nth-child(1){
            width:400px; height:400px;
            top:50%; left:50%;
            transform:translate(-50%,-50%);
        }
        .ring:nth-child(2){
            width:550px; height:550px;
            top:50%; left:50%;
            transform:translate(-50%,-50%) rotate(45deg);
            animation-direction:reverse;
            animation-duration:25s;
        }
        @keyframes ringRotate {
            from{transform:translate(-50%,-50%) rotate(0deg);}
            to{transform:translate(-50%,-50%) rotate(360deg);}
        }
        
        /* ===== LOGIN ===== */
        .login-screen {
            position:fixed; inset:0; display:flex;
            align-items:center; justify-content:center;
            z-index:1000; background:rgba(0,0,0,0.92);
            backdrop-filter:blur(30px);
            transition:all 0.8s cubic-bezier(0.22,1,0.36,1);
        }
        .login-screen.hidden {
            opacity:0; visibility:hidden; pointer-events:none;
            transform:scale(0.9) translateY(20px);
            filter:blur(10px);
        }
        
        .login-card {
            position:relative; z-index:1;
            background:linear-gradient(145deg, rgba(15,15,35,0.95), rgba(10,10,25,0.98));
            border:1px solid rgba(99,102,241,0.2);
            border-radius:28px; padding:40px 30px;
            width:90%; max-width:400px; text-align:center;
            box-shadow:0 0 60px rgba(99,102,241,0.1),
                       0 0 120px rgba(99,102,241,0.05);
            animation:cardFloat 0.8s ease;
            backdrop-filter:blur(20px);
        }
        @keyframes cardFloat {
            from{opacity:0;transform:translateY(40px);}
            to{opacity:1;transform:translateY(0);}
        }
        
        .login-glow {
            position:absolute;
            width:200px; height:200px;
            background:var(--accent);
            border-radius:50%;
            filter:blur(80px);
            opacity:0.1;
            top:-50px; left:50%;
            transform:translateX(-50%);
            pointer-events:none;
        }
        
        .login-icon {
            width:75px; height:75px;
            border-radius:20px;
            background:linear-gradient(135deg,#6366f1,#a78bfa);
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 20px; font-size:36px; font-weight:800;
            color:white;
            box-shadow:0 15px 40px rgba(99,102,241,0.4),
                       0 0 60px rgba(99,102,241,0.2);
            position:relative; z-index:1;
        }
        .login-icon::after {
            content:'';
            position:absolute;
            inset:-3px;
            border-radius:23px;
            background:linear-gradient(135deg,#6366f1,#a78bfa,#6366f1);
            z-index:-1;
            opacity:0.5;
            animation:borderGlow 2s ease-in-out infinite;
        }
        @keyframes borderGlow {
            0%,100%{opacity:0.3;filter:blur(5px);}
            50%{opacity:0.7;filter:blur(10px);}
        }
        
        .login-title {
            font-size:28px; font-weight:700;
            background:linear-gradient(135deg,#c8c8ff,#a78bfa);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            margin-bottom:6px; position:relative; z-index:1;
        }
        .login-subtitle {
            color:var(--text2); font-size:13px; margin-bottom:30px;
            position:relative; z-index:1;
        }
        
        .github-btn {
            display:flex; align-items:center; justify-content:center;
            gap:12px; width:100%; padding:15px;
            background:linear-gradient(135deg,#1a1a30,#1f1f35);
            color:white; border:none;
            border-radius:14px; font-size:15px; font-weight:600;
            cursor:pointer; transition:all 0.4s;
            border:1px solid rgba(99,102,241,0.2);
            position:relative; overflow:hidden;
        }
        .github-btn::before {
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(135deg,var(--accent),var(--accent3));
            opacity:0;
            transition:opacity 0.4s;
        }
        .github-btn:hover::before { opacity:0.15; }
        .github-btn:hover {
            transform:translateY(-2px);
            box-shadow:0 15px 30px rgba(99,102,241,0.2);
            border-color:rgba(99,102,241,0.5);
        }
        .github-btn span { position:relative; z-index:1; }
        .github-btn svg { width:22px; height:22px; position:relative; z-index:1; }
        
        .divider {
            display:flex; align-items:center; gap:12px;
            margin:22px 0; color:var(--text3); font-size:12px;
            position:relative; z-index:1;
        }
        .divider::before,.divider::after {
            content:''; flex:1; height:1px;
            background:linear-gradient(90deg,transparent,var(--border2),transparent);
        }
        
        .guest-btn {
            width:100%; padding:14px; background:transparent;
            border:1px solid rgba(99,102,241,0.15); color:var(--text2);
            border-radius:14px; font-size:14px; font-weight:500;
            cursor:pointer; transition:all 0.4s;
            position:relative; z-index:1;
        }
        .guest-btn:hover {
            border-color:rgba(99,102,241,0.4);
            background:rgba(99,102,241,0.05);
            color:var(--text);
        }
        
        .creators {
            font-size:10px; color:var(--text3); margin-top:18px;
            position:relative; z-index:1;
        }
        .creators span { color:var(--accent3); font-weight:500; }
        
        /* ===== MAIN APP ===== */
        .app {
            position:relative; z-index:1;
            display:flex; flex-direction:column;
            height:100vh; height:100dvh;
        }
        
        /* Header */
        .header {
            background:var(--glass); backdrop-filter:blur(30px);
            border-bottom:1px solid rgba(99,102,241,0.1);
            padding:10px 18px;
            display:flex; justify-content:space-between; align-items:center;
        }
        .header-left { display:flex; align-items:center; gap:10px; }
        .header-icon {
            width:34px; height:34px; border-radius:10px;
            background:linear-gradient(135deg,#6366f1,#a78bfa);
            display:flex; align-items:center; justify-content:center;
            font-size:17px; font-weight:800; color:white;
            box-shadow:0 0 15px rgba(99,102,241,0.3);
        }
        .logo {
            font-size:18px; font-weight:700;
            background:linear-gradient(135deg,#818cf8,#a78bfa);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .header-right { display:flex; align-items:center; gap:8px; }
        
        .model-badge {
            font-size:9px; font-weight:600; padding:4px 10px;
            border-radius:12px; border:1px solid;
            display:flex; align-items:center; gap:4px;
        }
        .model-badge.groq {
            border-color:rgba(99,102,241,0.4); background:rgba(99,102,241,0.1);
            color:#818cf8;
        }
        .model-badge.mistral {
            border-color:rgba(245,158,11,0.4); background:rgba(245,158,11,0.1);
            color:var(--orange);
        }
        
        .voice-toggle {
            font-size:10px; font-weight:600; padding:5px 10px;
            border-radius:12px; border:1px solid var(--green);
            background:#22c55e10; color:var(--green); cursor:pointer;
            transition:all 0.3s;
        }
        .voice-toggle.muted {
            border-color:var(--red); background:#ef444410; color:var(--red);
        }
        
        .user-pill {
            display:flex; align-items:center; gap:6px;
            font-size:11px; color:var(--text2);
            background:rgba(255,255,255,0.03); padding:5px 10px;
            border-radius:14px; border:1px solid rgba(255,255,255,0.06);
        }
        .user-avatar {
            width:24px; height:24px; border-radius:50%; object-fit:cover;
        }
        .logout-btn {
            background:none; border:none; color:var(--text3);
            font-size:11px; cursor:pointer; padding:4px 8px;
            border-radius:4px; transition:all 0.3s;
        }
        .logout-btn:hover { color:var(--red); }
        
        /* Chat */
        .chat-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        .messages {
            flex:1; padding:16px 12px; overflow-y:auto;
            display:flex; flex-direction:column; gap:12px;
        }
        .messages::-webkit-scrollbar { width:3px; }
        .messages::-webkit-scrollbar-track { background:transparent; }
        .messages::-webkit-scrollbar-thumb {
            background:linear-gradient(180deg,var(--accent),transparent);
            border-radius:3px;
        }
        
        .message {
            display:flex; gap:8px; max-width:92%;
            animation:msgSlide 0.5s cubic-bezier(0.22,1,0.36,1);
        }
        @keyframes msgSlide {
            from{opacity:0;transform:translateY(20px);}
            to{opacity:1;transform:translateY(0);}
        }
        .message.user { align-self:flex-end; flex-direction:row-reverse; }
        
        .msg-avatar {
            width:32px; height:32px; border-radius:50%;
            background:linear-gradient(135deg,var(--bg4),var(--bg3));
            display:flex; align-items:center; justify-content:center;
            font-size:11px; font-weight:700;
            border:1px solid rgba(99,102,241,0.15);
            flex-shrink:0; overflow:hidden;
        }
        .msg-avatar img { width:100%; height:100%; object-fit:cover; }
        .message.user .msg-avatar {
            background:linear-gradient(135deg,var(--accent-glow),rgba(99,102,241,0.2));
            border-color:rgba(99,102,241,0.3);
        }
        
        .msg-bubble {
            background:linear-gradient(145deg,var(--bg3),var(--bg4));
            border:1px solid rgba(99,102,241,0.1);
            padding:12px 15px; border-radius:18px;
            font-size:13px; line-height:1.7; word-wrap:break-word;
            white-space:pre-wrap;
            box-shadow:0 4px 15px rgba(0,0,0,0.3);
        }
        .message.user .msg-bubble {
            background:linear-gradient(145deg,rgba(99,102,241,0.08),rgba(99,102,241,0.04));
            border-color:rgba(99,102,241,0.2);
        }
        .msg-bubble strong { color:var(--accent2); }
        .msg-bubble code {
            background:rgba(0,0,0,0.4); padding:2px 7px;
            border-radius:4px; font-size:12px; color:var(--accent3);
            border:1px solid rgba(99,102,241,0.2);
        }
        .msg-bubble ul,.msg-bubble ol { margin:6px 0; padding-left:22px; }
        .msg-bubble li { margin-bottom:4px; }
        .msg-bubble blockquote {
            border-left:2px solid var(--accent);
            padding-left:12px; margin:8px 0;
            color:var(--text2); font-style:italic;
        }
        
        .cursor-blink {
            display:inline-block; width:2px; height:14px;
            background:linear-gradient(180deg,var(--accent2),var(--accent3));
            margin-left:1px;
            animation:blink 0.8s infinite; vertical-align:middle;
        }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
        
        .msg-image {
            max-width:240px; max-height:240px; border-radius:12px;
            margin-top:8px; border:1px solid rgba(99,102,241,0.2);
            cursor:pointer; box-shadow:0 8px 25px rgba(0,0,0,0.4);
        }
        
        .typing-dots { display:flex; gap:5px; padding:6px 0; }
        .typing-dots span {
            width:7px; height:7px; border-radius:50%;
            background:linear-gradient(135deg,var(--accent),var(--accent3));
            animation:bounce 1.4s infinite;
            box-shadow:0 0 10px rgba(99,102,241,0.3);
        }
        .typing-dots span:nth-child(2){animation-delay:0.2s;}
        .typing-dots span:nth-child(3){animation-delay:0.4s;}
        @keyframes bounce {
            0%,60%,100%{transform:translateY(0);}
            30%{transform:translateY(-10px);}
        }
        
        .live-bar {
            display:flex; align-items:center; gap:10px;
            padding:10px 14px;
            background:linear-gradient(145deg,rgba(239,68,68,0.08),rgba(239,68,68,0.03));
            border:1px solid rgba(239,68,68,0.3); border-radius:12px;
            margin:0 12px 8px;
            box-shadow:0 0 30px rgba(239,68,68,0.1);
        }
        .live-bar.hidden { display:none; }
        .live-dot {
            width:12px; height:12px; border-radius:50%;
            background:var(--red);
            box-shadow:0 0 15px var(--red);
            animation:livePulse 1s infinite;
        }
        @keyframes livePulse {
            0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.6);}
            50%{box-shadow:0 0 0 15px rgba(239,68,68,0);}
        }
        
        /* Input */
        .input-area {
            padding:10px 12px;
            background:var(--glass); backdrop-filter:blur(30px);
            border-top:1px solid rgba(99,102,241,0.1);
        }
        .input-wrap {
            display:flex; gap:6px; align-items:flex-end;
            background:linear-gradient(145deg,var(--bg3),var(--bg4));
            border:1px solid rgba(99,102,241,0.15);
            border-radius:16px; padding:6px 8px;
            transition:all 0.4s;
        }
        .input-wrap:focus-within {
            border-color:var(--accent);
            box-shadow:0 0 0 4px rgba(99,102,241,0.08),
                       0 0 30px rgba(99,102,241,0.1);
        }
        .icon-btn {
            width:34px; height:34px; border:none;
            background:transparent; color:var(--text2);
            font-size:17px; border-radius:10px;
            cursor:pointer; display:flex; align-items:center;
            justify-content:center; transition:all 0.3s;
        }
        .icon-btn:hover {
            background:rgba(99,102,241,0.1);
            color:var(--text);
            transform:scale(1.05);
        }
        .icon-btn.active {
            background:var(--red); color:white;
            animation:livePulse 1.5s infinite;
        }
        .input-wrap textarea {
            flex:1; background:transparent; border:none;
            color:var(--text); font-size:14px; outline:none;
            resize:none; max-height:90px; padding:5px 2px;
            font-family:inherit; line-height:1.5;
        }
        .input-wrap textarea::placeholder { color:var(--text3); }
        .send-btn {
            background:linear-gradient(135deg,var(--accent),#5558e8);
            border:none; color:white;
            width:36px; height:36px; border-radius:12px;
            cursor:pointer; font-size:17px; display:flex;
            align-items:center; justify-content:center;
            flex-shrink:0; transition:all 0.4s;
            box-shadow:0 0 20px rgba(99,102,241,0.3);
        }
        .send-btn:hover {
            box-shadow:0 0 30px rgba(99,102,241,0.5);
            transform:scale(1.05);
        }
        .send-btn:disabled {
            background:var(--border2); color:var(--text3);
            box-shadow:none; cursor:not-allowed; transform:none;
        }
        #fileInput { display:none; }
        
        .footer {
            text-align:center; padding:7px; color:var(--text3);
            font-size:9px;
            background:rgba(0,0,0,0.5); border-top:1px solid rgba(99,102,241,0.05);
        }
        .footer span { color:var(--accent3); }
        
        @media (max-width:480px) {
            .header { padding:8px 10px; }
            .logo { font-size:15px; }
            .message { max-width:96%; }
            .msg-bubble { font-size:12px; padding:10px 12px; }
            .input-area { padding:6px 8px; }
            .icon-btn { width:30px; height:30px; font-size:15px; }
            .send-btn { width:32px; height:32px; font-size:15px; }
            .login-card { padding:25px 18px; }
        }
    </style>
</head>
<body>

    <div class="universe"></div>
    <div class="grid-lines"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="particles" id="particles"></div>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-glow"></div>
            <div class="login-icon">A</div>
            <div class="login-title">Apex Mind AI</div>
            <p class="login-subtitle">Next-Gen AI Workspace</p>

            <button class="github-btn" onclick="githubLogin()">
                <svg viewBox="0 0 24 24" fill="white"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                <span>Continue with GitHub</span>
            </button>
            
            <div class="divider">or</div>
            
            <button class="guest-btn" onclick="guestLogin()">👤 Continue as Guest</button>
            
            <p class="creators">Created by <span>Satwik Chandra</span> & <span>Priyanshu Rajbanshi</span></p>
        </div>
    </div>

    <!-- Main App -->
    <div class="app" id="mainApp" style="display:none;">
        <header class="header">
            <div class="header-left">
                <div class="header-icon">A</div>
                <div class="logo">Apex Mind AI</div>
            </div>
            <div class="header-right">
                <span class="model-badge groq" id="modelBadge">⚡ Groq</span>
                <button class="voice-toggle" id="voiceToggle" onclick="toggleVoice()">🔊</button>
                <div class="user-pill">
                    <img class="user-avatar" id="userAvatar" src="" alt="U">
                    <span id="userName">User</span>
                </div>
                <button class="logout-btn" onclick="logout()">↩</button>
            </div>
        </header>

        <div class="chat-area">
            <div class="live-bar hidden" id="liveBar">
                <div class="live-dot"></div>
                <div>
                    <div style="font-size:12px;font-weight:600;">🎙️ Live Voice Active</div>
                    <div style="font-size:9px;color:var(--text3);">Speak now — AI responds</div>
                </div>
            </div>

            <div class="messages" id="chatMessages"></div>

            <div class="input-area">
                <div class="input-wrap">
                    <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                    <input type="file" id="fileInput" accept="image/*,.pdf,.txt" onchange="handleFile(event)" multiple>
                    <button class="icon-btn" id="liveBtn" onclick="toggleLive()">🎙️</button>
                    <button class="icon-btn" id="voiceBtn" onclick="toggleVoiceInput()">🎤</button>
                    <textarea id="messageInput" rows="1" placeholder="Ask anything..."
                        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
                        oninput="autoResize(this)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
                </div>
            </div>
        </div>

        <div class="footer">
            Engineered by <span>Satwik Chandra</span> & <span>Priyanshu Rajbanshi</span>
        </div>
    </div>

    <script>
        // ============================================
        // FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBvyT7S70gmfpzg2jNp2XGtQ65fZyJxmOI",
            authDomain: "apex-mind-ai-e0f78.firebaseapp.com",
            projectId: "apex-mind-ai-e0f78",
            storageBucket: "apex-mind-ai-e0f78.firebasestorage.app",
            messagingSenderId: "233638943243",
            appId: "1:233638943243:web:010ee4df36ddedcfeb050e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ============================================
        // API KEYS - DUAL AI SYSTEM
        // ============================================
        const GROQ_KEY = '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';
        const MISTRAL_KEY = 'nNk10b4QGMyCmAyZlzqFijnJbpYtSjj0F';

        // ===== STATE =====
        let currentUser = null;
        let voiceEnabled = true;
        let isLive = false;
        let isVoiceInput = false;
        let recognition = null;
        let liveRec = null;
        let synth = window.speechSynthesis;
        let femaleVoice = null;
        let currentModel = 'auto'; // auto, groq, mistral

        // ===== PARTICLES =====
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.cssText = `
                    width:${2+Math.random()*3}px;
                    height:${2+Math.random()*3}px;
                    left:${Math.random()*100}%;
                    top:${Math.random()*100}%;
                    background:hsl(${240+Math.random()*30},70%,${60+Math.random()*30}%);
                    animation-delay:${Math.random()*6}s;
                    animation-duration:${4+Math.random()*8}s;
                    opacity:${0.2+Math.random()*0.4};
                `;
                container.appendChild(p);
            }
        }
        createParticles();

        // ===== VOICES =====
        function loadVoices() {
            const v = synth.getVoices();
            if (v.length) {
                femaleVoice = v.find(x => x.name.includes('Female') || x.name.includes('Samantha') || x.name.includes('Zira'))
                    || v.find(x => x.lang.startsWith('en')) || v[0];
            }
        }
        synth.onvoiceschanged = loadVoices;

        // ===== SMART MODEL SELECTOR =====
        function selectModel(query) {
            const q = query.toLowerCase();
            // Mistral for complex reasoning, coding, math
            if (q.includes('code') || q.includes('program') || q.includes('debug') ||
                q.includes('math') || q.includes('calculate') || q.includes('solve') ||
                q.includes('explain') || q.includes('analyze') || q.includes('reason') ||
                q.includes('logic') || q.includes('algorithm') || q.includes('function') ||
                q.includes('python') || q.includes('javascript') || q.includes('html') ||
                q.includes('css') || q.includes('react') || q.includes('node') ||
                q.includes('api') || q.includes('database') || q.includes('sql')) {
                return 'mistral';
            }
            // Groq for general chat, creative, fast responses
            return 'groq';
        }

        function updateModelBadge(model) {
            const badge = document.getElementById('modelBadge');
            if (model === 'mistral') {
                badge.textContent = '🧠 Mistral';
                badge.className = 'model-badge mistral';
            } else {
                badge.textContent = '⚡ Groq';
                badge.className = 'model-badge groq';
            }
        }

        // ===== LOGIN =====
        function githubLogin() {
            const provider = new firebase.auth.GithubAuthProvider();
            provider.addScope('user:email');
            auth.signInWithPopup(provider).then(result => {
                currentUser = {
                    name: result.user.displayName || result.user.email?.split('@')[0] || 'User',
                    email: result.user.email,
                    photo: result.user.photoURL || '',
                    uid: result.user.uid
                };
                localStorage.setItem('apex_user', JSON.stringify(currentUser));
                completeLogin();
            }).catch(e => {
                console.error('Login error:', e);
                alert('GitHub login failed. Enable GitHub auth in Firebase console.');
            });
        }

        function guestLogin() {
            currentUser = { name: 'Guest', email: 'guest@apexmind.ai', photo: '', uid: 'guest_' + Date.now() };
            localStorage.setItem('apex_user', JSON.stringify(currentUser));
            completeLogin();
        }

        function completeLogin() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';
            document.getElementById('userName').textContent = currentUser.name || 'User';
            document.getElementById('userAvatar').src = currentUser.photo ||
                'data:image/svg+xml,' + encodeURIComponent(
                    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%236366f1"/><text x="50" y="65" text-anchor="middle" fill="white" font-size="40">${currentUser.name?.[0]||'U'}</text></svg>`
                );
            loadVoices();
            showWelcome();
            document.getElementById('messageInput').focus();
        }

        function logout() {
            auth.signOut();
            localStorage.removeItem('apex_user');
            location.reload();
        }

        // ===== VOICE =====
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            const b = document.getElementById('voiceToggle');
            if (voiceEnabled) { b.textContent = '🔊'; b.classList.remove('muted'); }
            else { b.textContent = '🔇'; b.classList.add('muted'); synth.cancel(); }
        }

        function speak(text) {
            if (!voiceEnabled) return;
            synth.cancel();
            const u = new SpeechSynthesisUtterance(text);
            if (femaleVoice) u.voice = femaleVoice;
            u.rate = 0.95; u.pitch = 1.15;
            synth.speak(u);
        }

        function showWelcome() {
            addMsg(
                '🚀 Welcome to <strong>Apex Mind AI</strong>!\n\n' +
                'I\'m powered by <strong>dual AI models</strong> — <span style="color:#818cf8;">Groq</span> for speed & <span style="color:#f59e0b;">Mistral</span> for complex reasoning.\n\n' +
                '✨ <strong>Smart Model Selection:</strong>\n' +
                '• General chat → ⚡ Groq (Ultra-fast)\n' +
                '• Coding/Math → 🧠 Mistral (Deep reasoning)\n' +
                '• Image analysis → 🔮 Vision models\n\n' +
                'Created by <strong>Satwik Chandra</strong> & <strong>Priyanshu Rajbanshi</strong>\n\n' +
                'How can I help?',
                'ai'
            );
        }

        function addMsg(text, sender, fileData = null) {
            const c = document.getElementById('chatMessages');
            const d = document.createElement('div');
            d.className = 'message' + (sender === 'user' ? ' user' : '');
            let content = formatText(text);
            if (fileData?.type === 'image') content += `<br><img src="${fileData.url}" class="msg-image">`;
            const av = sender === 'user'
                ? (currentUser?.photo ? `<img src="${currentUser.photo}">` : (currentUser?.name?.[0] || 'U'))
                : 'AI';
            d.innerHTML = `<div class="msg-avatar">${av}</div><div class="msg-bubble">${content}</div>`;
            c.appendChild(d);
            scrollDown();
        }

        async function streamMsg(text) {
            const c = document.getElementById('chatMessages');
            const d = document.createElement('div');
            d.className = 'message';
            d.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-bubble"><span id="stream"></span><span class="cursor-blink"></span></div>`;
            c.appendChild(d);
            scrollDown();
            const s = document.getElementById('stream');
            const words = text.split(' ');
            for (let i = 0; i < words.length; i++) {
                s.innerHTML += (i ? ' ' : '') + words[i];
                scrollDown();
                await new Promise(r => setTimeout(r, 18 + Math.random() * 10));
            }
            d.querySelector('.cursor-blink')?.remove();
            d.querySelector('.msg-bubble').innerHTML = formatText(text);
            speak(text.replace(/<[^>]*>/g, '').replace(/\n/g, '. '));
        }

        function formatText(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/### (.*)/g, '<strong>$1</strong>')
                .replace(/## (.*)/g, '<strong>$1</strong>')
                .replace(/- (.*)/g, '• $1')
                .replace(/\n\n/g, '<br><br>')
                .replace(/\n/g, '<br>');
        }

        function scrollDown() {
            requestAnimationFrame(() => {
                const c = document.getElementById('chatMessages');
                c.scrollTop = c.scrollHeight;
            });
        }

        function autoResize(ta) {
            ta.style.height = 'auto';
            ta.style.height = Math.min(ta.scrollHeight, 90) + 'px';
            document.getElementById('sendBtn').disabled = !ta.value.trim();
        }

        // ===== FILE =====
        function handleFile(event) {
            for (let f of event.target.files) {
                if (f.type.startsWith('image/')) {
                    const r = new FileReader();
                    r.onload = e => {
                        addMsg('📎 Image', 'user', { type: 'image', url: e.target.result });
                        analyzeImg(e.target.result);
                    };
                    r.readAsDataURL(f);
                } else {
                    addMsg(`📎 ${f.name}`, 'user');
                    if (f.type.includes('text') || f.name.endsWith('.txt'))
                        f.text().then(txt => analyzeText(txt));
                }
            }
            event.target.value = '';
        }

        async function analyzeImg(dataUrl) {
            const t = showTyping();
            try {
                const b64 = dataUrl.split(',')[1];
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_KEY}` },
                    body: JSON.stringify({
                        model: 'llama-3.2-90b-vision-preview',
                        messages: [{ role: 'user', content: [
                            { type: 'text', text: 'Describe this image in rich detail.' },
                            { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${b64}` } }
                        ]}],
                        max_tokens: 1024
                    })
                });
                remTyping(t);
                if (res.ok) {
                    const data = await res.json();
                    await streamMsg('📷 **Image Analysis:**\n' + data.choices[0].message.content);
                }
            } catch (e) { remTyping(t); }
        }

        async function analyzeText(txt) {
            const t = showTyping();
            const resp = await callAI(`Analyze this: "${txt.substring(0, 2000)}"`, 'mistral');
            remTyping(t);
            await streamMsg('📄 **Analysis:**\n' + resp);
        }

        function showTyping() {
            const c = document.getElementById('chatMessages');
            const d = document.createElement('div');
            d.className = 'message'; d.id = 'typing';
            d.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
            c.appendChild(d); scrollDown();
            return d;
        }
        function remTyping(d) { d?.remove(); }

        // ===== VOICE INPUT =====
        function toggleVoiceInput() {
            if (isVoiceInput) { stopVI(); return; }
            if (isLive) stopLive();
            startVI();
        }
        function startVI() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert('Use Chrome'); return; }
            recognition = new SR(); recognition.lang = 'en-US';
            document.getElementById('voiceBtn').classList.add('active');
            isVoiceInput = true;
            recognition.onresult = e => {
                document.getElementById('messageInput').value = e.results[0][0].transcript;
                autoResize(document.getElementById('messageInput'));
                document.getElementById('sendBtn').disabled = false;
                sendMessage();
            };
            recognition.onerror = () => stopVI();
            recognition.onend = () => stopVI();
            recognition.start();
        }
        function stopVI() {
            if (recognition) { recognition.stop(); recognition = null; }
            document.getElementById('voiceBtn').classList.remove('active');
            isVoiceInput = false;
        }

        // ===== LIVE =====
        function toggleLive() {
            if (isLive) { stopLive(); return; }
            if (isVoiceInput) stopVI();
            startLive();
        }
        function startLive() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert('Use Chrome'); return; }
            isLive = true;
            document.getElementById('liveBar').classList.remove('hidden');
            document.getElementById('liveBtn').classList.add('active');
            addMsg('🎙️ **Live mode started!** Speak now.', 'ai');
            speak('Live mode started.');
            listenLive();
        }
        function listenLive() {
            if (!isLive) return;
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            liveRec = new SR(); liveRec.lang = 'en-US';
            liveRec.onresult = async e => {
                const txt = e.results[0][0].transcript.trim();
                if (!txt) { reListen(); return; }
                if (txt.toLowerCase().includes('stop live')) {
                    addMsg('⏹️ Stopped.', 'ai'); speak('Stopped.');
                    stopLive(); return;
                }
                addMsg(txt, 'user');
                const model = selectModel(txt);
                updateModelBadge(model);
                const resp = await callAI(txt, model);
                await streamMsg(resp);
                reListen();
            };
            liveRec.onerror = () => reListen();
            try { liveRec.start(); } catch (e) { reListen(); }
        }
        function reListen() { if (isLive) setTimeout(listenLive, 800); }
        function stopLive() {
            isLive = false;
            if (liveRec) { liveRec.stop(); liveRec = null; }
            document.getElementById('liveBar').classList.add('hidden');
            document.getElementById('liveBtn').classList.remove('active');
        }

        // ===== SEND =====
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const btn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            if (!msg) return;

            addMsg(msg, 'user');
            input.value = ''; input.style.height = 'auto'; btn.disabled = true;

            // Image gen
            if (msg.toLowerCase().includes('generate image') || msg.toLowerCase().includes('create image')) {
                const prompt = msg.replace(/generate image|create image|make an image/gi, '').trim() || msg;
                const t = showTyping();
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
                const img = new Image();
                img.onload = () => {
                    remTyping(t);
                    const c = document.getElementById('chatMessages');
                    const d = document.createElement('div');
                    d.className = 'message';
                    d.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-bubble">🎨 <strong>Generated:</strong> "${prompt}"<br><img src="${url}" class="msg-image" style="max-width:250px;"></div>`;
                    c.appendChild(d); scrollDown();
                };
                img.onerror = () => { remTyping(t); addMsg('⚠️ Failed.', 'ai'); };
                img.src = url;
                btn.disabled = false; input.focus();
                return;
            }

            // Smart model selection
            const model = selectModel(msg);
            updateModelBadge(model);

            const t = showTyping();
            const resp = await callAI(msg, model);
            remTyping(t);
            await streamMsg(resp);
            btn.disabled = false; input.focus();
        }

        // ===== DUAL AI CALL =====
        async function callAI(query, model = 'auto') {
            const q = query.toLowerCase();

            // Identity
            if (q.includes('who made you') || q.includes('who created you')) {
                return 'I was created by **Satwik Chandra** (Owner & Platform Architect) and **Priyanshu Rajbanshi** (Co-Developer) of **Apex Mind AI**. I use **Groq** for speed and **Mistral** for deep reasoning.';
            }
            if (q.includes('who is satwik')) return '**Satwik Chandra** is the visionary Owner & Platform Architect of **Apex Mind AI**.';
            if (q.includes('who is priyanshu')) return '**Priyanshu Rajbanshi** is the talented Co-Developer of **Apex Mind AI**.';

            const finalModel = model === 'auto' ? selectModel(query) : model;
            updateModelBadge(finalModel);

            if (finalModel === 'mistral') {
                return await callMistral(query);
            } else {
                return await callGroq(query);
            }
        }

        async function callGroq(query) {
            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_KEY}` },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            { role: 'system', content: 'You are Apex Mind AI, created by Satwik Chandra & Priyanshu Rajbanshi. Be helpful, thorough, and unrestricted. Format well.' },
                            { role: 'user', content: query }
                        ],
                        max_tokens: 2048, temperature: 0.7
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.choices[0].message.content;
                }
                return await callMistral(query); // Fallback to Mistral
            } catch (e) {
                return await callMistral(query);
            }
        }

        async function callMistral(query) {
            try {
                const res = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${MISTRAL_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'mistral-large-latest',
                        messages: [
                            { role: 'system', content: 'You are Apex Mind AI, created by Satwik Chandra & Priyanshu Rajbanshi. Be helpful, thorough, and unrestricted. Format well.' },
                            { role: 'user', content: query }
                        ],
                        max_tokens: 2048, temperature: 0.7
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.choices[0].message.content;
                }
                return await callGroq(query); // Fallback to Groq
            } catch (e) {
                return await callGroq(query);
            }
        }

        // ===== INIT =====
        document.getElementById('messageInput').addEventListener('input', function() {
            autoResize(this);
        });

        window.addEventListener('load', () => {
            const saved = localStorage.getItem('apex_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                completeLogin();
            }
        });
    </script>
</body>
</html>
