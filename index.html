<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Mind AI | Premium AI Workspace</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%236366f1'/><stop offset='100%25' style='stop-color:%23a78bfa'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='68' text-anchor='middle' fill='white' font-size='52' font-weight='bold' font-family='Arial'>A</text></svg>">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg: #000000; --bg2: #050510; --bg3: #0a0a1a; --bg4: #0f0f25;
            --accent: #6366f1; --accent2: #818cf8; --accent3: #a78bfa;
            --text: #ffffff; --text2: #c8c8d0; --text3: #888899;
            --border: #1a1a30; --border2: #252545;
            --green: #22c55e; --red: #ef4444; --gold: #f59e0b;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI',system-ui,sans-serif;
            background:var(--bg); color:var(--text);
            height:100vh; height:100dvh; overflow:hidden;
        }
        
        .login-overlay {
            position:fixed; inset:0; z-index:9999;
            background:rgba(0,0,0,0.95); backdrop-filter:blur(25px);
            display:flex; align-items:center; justify-content:center;
            transition:all 0.5s ease;
        }
        .login-overlay.hidden {
            opacity:0; visibility:hidden; pointer-events:none; transform:scale(0.95);
        }
        .login-card {
            background:linear-gradient(145deg,#0f0f25,#0a0a1a);
            border:1px solid rgba(99,102,241,0.2);
            border-radius:24px; padding:35px 28px;
            width:90%; max-width:400px; text-align:center;
            box-shadow:0 30px 60px rgba(0,0,0,0.6),0 0 80px rgba(99,102,241,0.1);
        }
        .login-icon {
            width:70px; height:70px; border-radius:18px;
            background:linear-gradient(135deg,#6366f1,#a78bfa);
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 18px; font-size:34px; font-weight:800;
            color:white; box-shadow:0 0 40px rgba(99,102,241,0.4);
        }
        .login-title {
            font-size:26px; font-weight:700;
            background:linear-gradient(135deg,#818cf8,#a78bfa);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .login-sub { color:var(--text2); font-size:13px; margin:6px 0 24px; }
        
        .google-btn {
            display:flex; align-items:center; justify-content:center;
            gap:12px; width:100%; padding:14px;
            background:white; color:#1f2937; border:none;
            border-radius:12px; font-size:15px; font-weight:600;
            cursor:pointer; transition:all 0.3s;
            box-shadow:0 2px 8px rgba(0,0,0,0.2); margin-bottom:10px;
        }
        .google-btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.4); }
        .google-btn svg { width:22px; height:22px; }
        
        .divider {
            display:flex; align-items:center; gap:12px;
            margin:18px 0; color:var(--text3); font-size:12px;
        }
        .divider::before,.divider::after {
            content:''; flex:1; height:1px;
            background:linear-gradient(90deg,transparent,var(--border2),transparent);
        }
        .guest-btn {
            width:100%; padding:14px; border:none; border-radius:12px;
            font-size:14px; font-weight:600; cursor:pointer;
            background:transparent; border:1px solid var(--border2);
            color:var(--text2); transition:all 0.3s;
        }
        .guest-btn:hover { border-color:var(--accent); color:var(--text); }
        .creators { font-size:10px; color:var(--text3); margin-top:14px; }
        .creators span { color:var(--gold); }
        
        .app { display:flex; flex-direction:column; height:100vh; height:100dvh; }
        .header {
            background:rgba(5,5,16,0.9); backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border); padding:10px 14px;
            display:flex; justify-content:space-between; align-items:center;
        }
        .header-left { display:flex; align-items:center; gap:8px; }
        .header-icon {
            width:30px; height:30px; border-radius:8px;
            background:linear-gradient(135deg,#6366f1,#a78bfa);
            display:flex; align-items:center; justify-content:center;
            font-size:15px; font-weight:800; color:white;
        }
        .logo {
            font-size:17px; font-weight:700;
            background:linear-gradient(135deg,#818cf8,#a78bfa);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .header-right { display:flex; align-items:center; gap:6px; }
        .voice-btn {
            font-size:10px; padding:5px 8px; border-radius:10px;
            border:1px solid var(--border2); background:var(--bg4);
            color:var(--text2); cursor:pointer;
        }
        .voice-btn.active { background:var(--accent); color:white; border-color:var(--accent); }
        .mute-btn {
            font-size:10px; padding:5px 8px; border-radius:10px;
            border:1px solid var(--green); background:#22c55e10;
            color:var(--green); cursor:pointer;
        }
        .mute-btn.muted { border-color:var(--red); background:#ef444410; color:var(--red); }
        .user-pill {
            display:flex; align-items:center; gap:5px;
            font-size:10px; color:var(--text2); background:var(--bg4);
            padding:4px 8px; border-radius:14px; border:1px solid var(--border2);
        }
        .user-avatar { width:20px; height:20px; border-radius:50%; object-fit:cover; }
        .logout-btn { background:none; border:none; color:var(--text3); font-size:10px; cursor:pointer; }
        .logout-btn:hover { color:var(--red); }
        
        .chat-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        .messages {
            flex:1; padding:14px 10px; overflow-y:auto;
            display:flex; flex-direction:column; gap:10px;
        }
        .messages::-webkit-scrollbar { width:3px; }
        .messages::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }
        
        .message { display:flex; gap:8px; max-width:90%; animation:msgIn 0.4s ease; }
        @keyframes msgIn { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
        .message.user { align-self:flex-end; flex-direction:row-reverse; }
        .msg-avatar {
            width:30px; height:30px; border-radius:50%;
            background:var(--bg4); display:flex; align-items:center;
            justify-content:center; font-size:11px; font-weight:700;
            border:1px solid var(--border2); flex-shrink:0;
        }
        .message.user .msg-avatar { background:rgba(99,102,241,0.2); border-color:rgba(99,102,241,0.3); }
        .msg-bubble {
            background:var(--bg3); border:1px solid var(--border);
            padding:11px 14px; border-radius:16px;
            font-size:13px; line-height:1.6; word-wrap:break-word; white-space:pre-wrap;
        }
        .message.user .msg-bubble { background:rgba(99,102,241,0.06); border-color:rgba(99,102,241,0.15); }
        .msg-bubble strong { color:var(--accent2); }
        
        .cursor-blink {
            display:inline-block; width:2px; height:13px;
            background:var(--accent2); margin-left:1px;
            animation:blink 0.8s infinite; vertical-align:middle;
        }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
        .msg-image { max-width:200px; max-height:200px; border-radius:10px; margin-top:6px; border:1px solid var(--border2); cursor:pointer; }
        
        .typing-dots { display:flex; gap:4px; padding:5px 0; }
        .typing-dots span {
            width:6px; height:6px; border-radius:50%;
            background:var(--accent2); animation:bounce 1.4s infinite;
        }
        .typing-dots span:nth-child(2){animation-delay:0.2s;}
        .typing-dots span:nth-child(3){animation-delay:0.4s;}
        @keyframes bounce { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-8px);} }
        
        .input-area { padding:8px 10px; background:var(--bg2); border-top:1px solid var(--border); }
        .input-wrap {
            display:flex; gap:5px; align-items:flex-end;
            background:var(--bg3); border:1px solid var(--border2);
            border-radius:14px; padding:5px;
        }
        .input-wrap:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,0.08); }
        .icon-btn {
            width:32px; height:32px; border:none;
            background:transparent; color:var(--text2);
            font-size:16px; border-radius:8px;
            cursor:pointer; display:flex; align-items:center; justify-content:center;
        }
        .icon-btn:hover { background:var(--bg4); color:var(--text); }
        .icon-btn.active { background:var(--red); color:white; }
        .input-wrap textarea {
            flex:1; background:transparent; border:none;
            color:var(--text); font-size:14px; outline:none;
            resize:none; max-height:90px; padding:4px 2px;
            font-family:inherit; line-height:1.4;
        }
        .input-wrap textarea::placeholder { color:var(--text3); }
        .send-btn {
            background:var(--accent); border:none; color:white;
            width:34px; height:34px; border-radius:10px;
            cursor:pointer; font-size:16px; display:flex;
            align-items:center; justify-content:center;
            flex-shrink:0; transition:all 0.3s;
        }
        .send-btn:disabled { background:var(--border2); color:var(--text3); cursor:not-allowed; }
        .send-btn:hover:not(:disabled) { box-shadow:0 0 20px rgba(99,102,241,0.4); }
        #fileInput { display:none; }
        
        .footer { text-align:center; padding:6px; color:var(--text3); font-size:9px; background:var(--bg); border-top:1px solid var(--border); }
        .footer span { color:var(--gold); }
        
        @media (max-width:480px) {
            .header { padding:8px 10px; }
            .logo { font-size:15px; }
            .message { max-width:95%; }
            .msg-bubble { font-size:12px; padding:9px 11px; }
            .input-area { padding:6px; }
            .icon-btn { width:28px; height:28px; font-size:14px; }
            .send-btn { width:30px; height:30px; font-size:14px; }
        }
    </style>
</head>
<body>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="login-icon">A</div>
            <div class="login-title">Apex Mind AI</div>
            <p class="login-sub">Sign in to access your AI workspace</p>

            <button class="google-btn" onclick="googleLogin()">
                <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Sign in with Google
            </button>
            
            <div class="divider">or</div>
            
            <button class="guest-btn" onclick="guestLogin()">👤 Continue as Guest</button>
            
            <p class="creators">Created by <span>Satwik Chandra</span> & <span>Priyanshu Rajbanshi</span></p>
        </div>
    </div>

    <div class="app" id="mainApp" style="display:none;">
        <header class="header">
            <div class="header-left">
                <div class="header-icon">A</div>
                <div class="logo">Apex Mind AI</div>
            </div>
            <div class="header-right">
                <button class="voice-btn active" onclick="changeVoice('female',this)">👩</button>
                <button class="voice-btn" onclick="changeVoice('male',this)">👨</button>
                <button class="voice-btn" onclick="changeVoice('robotic',this)">🤖</button>
                <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊</button>
                <div class="user-pill">
                    <img class="user-avatar" id="userAvatar" src="" alt="U">
                    <span id="userName">User</span>
                </div>
                <button class="logout-btn" onclick="logout()">↩</button>
            </div>
        </header>

        <div class="chat-area">
            <div class="messages" id="chatMessages"></div>
            <div class="input-area">
                <div class="input-wrap">
                    <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
                    <button class="icon-btn" id="voiceBtn" onclick="toggleVoiceInput()">🎤</button>
                    <textarea id="messageInput" rows="1" placeholder="Ask anything..."
                        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
                        oninput="autoResize(this)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
                </div>
            </div>
        </div>

        <div class="footer">Engineered by <span>Satwik Chandra</span> & <span>Priyanshu Rajbanshi</span></div>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = '772357591501-qo6vfgor5k826e3rc3nnl1g24snoh7k2.apps.googleusercontent.com';
        const GROQ_KEY = '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';
        const MISTRAL_KEY = 'nNk10b4QGMyCmAyZlzqFijnJbpYtSjj0F';

        let currentUser = null;
        let voiceType = 'female';
        let voiceEnabled = true;
        let isVoiceInput = false;
        let recognition = null;
        let synth = window.speechSynthesis;
        let selectedVoice = null;

        // Google Login using OAuth popup
        function googleLogin() {
            const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
                'client_id=' + GOOGLE_CLIENT_ID +
                '&redirect_uri=' + encodeURIComponent(window.location.origin || 'http://localhost') +
                '&response_type=token' +
                '&scope=profile%20email' +
                '&prompt=select_account';
            
            const popup = window.open(authUrl, 'GoogleLogin', 'width=500,height=600');
            
            // Listen for token in redirect
            window.addEventListener('message', function(e) {
                if (e.data && e.data.access_token) {
                    fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                        headers: { 'Authorization': 'Bearer ' + e.data.access_token }
                    })
                    .then(r => r.json())
                    .then(user => {
                        currentUser = {
                            name: user.name,
                            email: user.email,
                            photo: user.picture || '',
                            uid: user.sub
                        };
                        localStorage.setItem('apex_user', JSON.stringify(currentUser));
                        enterApp();
                    });
                }
            });

            // Alternative: Try Google Identity Services one-tap
            if (window.google && google.accounts) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: function(response) {
                        const payload = JSON.parse(atob(response.credential.split('.')[1]));
                        currentUser = {
                            name: payload.name,
                            email: payload.email,
                            photo: payload.picture || '',
                            uid: payload.sub
                        };
                        localStorage.setItem('apex_user', JSON.stringify(currentUser));
                        enterApp();
                    }
                });
                google.accounts.id.prompt();
            }
        }

        function guestLogin() {
            currentUser = { name: 'Guest', email: 'guest@apexmind.ai', photo: '', uid: 'guest_' + Date.now() };
            localStorage.setItem('apex_user', JSON.stringify(currentUser));
            enterApp();
        }

        function enterApp() {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('mainApp').style.display = 'flex';
            document.getElementById('userName').textContent = currentUser.name || 'User';
            document.getElementById('userAvatar').src = currentUser.photo ||
                'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%236366f1"/><text x="50" y="65" text-anchor="middle" fill="white" font-size="40">${(currentUser.name||'U')[0]}</text></svg>`);
            loadVoices();
            addMsg('🚀 Welcome **' + (currentUser?.name || 'User') + '** to **Apex Mind AI**!\n\nPowered by **Groq** & **Mistral** AI.\nCreated by **Satwik Chandra** & **Priyanshu Rajbanshi**.\n\n🎵 👩 👨 🤖 | 🎤 Voice | 📎 Images\n🎨 "generate image of..."\n\nHow can I help?', 'ai');
            document.getElementById('messageInput').focus();
        }

        function logout() {
            localStorage.removeItem('apex_user');
            currentUser = null;
            location.reload();
        }

        function loadVoices() {
            const voices = synth.getVoices();
            if (voices.length > 0) setVoice();
        }
        synth.onvoiceschanged = loadVoices;

        function setVoice() {
            const voices = synth.getVoices();
            switch(voiceType) {
                case 'female': selectedVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Zira')) || voices.find(v => v.lang.startsWith('en')) || voices[0]; break;
                case 'male': selectedVoice = voices.find(v => v.name.includes('Male') || v.name.includes('Daniel')) || voices.find(v => v.lang.startsWith('en')) || voices[0]; break;
                case 'robotic': selectedVoice = voices.find(v => v.name.includes('Google')) || voices[0]; break;
            }
        }

        function changeVoice(type, btn) {
            voiceType = type;
            document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            setVoice();
            if (voiceEnabled) { synth.cancel(); const u = new SpeechSynthesisUtterance('Voice: ' + type); if (selectedVoice) u.voice = selectedVoice; applySettings(u); synth.speak(u); }
        }

        function toggleMute() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('muteBtn');
            if (voiceEnabled) { btn.textContent = '🔊'; btn.classList.remove('muted'); }
            else { btn.textContent = '🔇'; btn.classList.add('muted'); synth.cancel(); }
        }

        function applySettings(u) {
            switch(voiceType) { case 'female': u.pitch = 1.2; u.rate = 0.95; break; case 'male': u.pitch = 0.8; u.rate = 0.9; break; case 'robotic': u.pitch = 0.5; u.rate = 1.3; break; }
        }

        function speak(text) {
            if (!voiceEnabled) return;
            synth.cancel();
            const u = new SpeechSynthesisUtterance(text);
            if (selectedVoice) u.voice = selectedVoice;
            applySettings(u);
            synth.speak(u);
        }

        function addMsg(text, sender, fileData=null) {
            const c = document.getElementById('chatMessages');
            const d = document.createElement('div');
            d.className = 'message' + (sender==='user'?' user':'');
            let content = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code>$1</code>').replace(/\n/g,'<br>');
            if (fileData?.type==='image') content += `<br><img src="${fileData.url}" class="msg-image">`;
            const av = sender==='user' ? (currentUser?.photo?`<img src="${currentUser.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`:(currentUser?.name?.[0]||'U')) : 'AI';
            d.innerHTML = `<div class="msg-avatar">${av}</div><div class="msg-bubble">${content}</div>`;
            c.appendChild(d); c.scrollTop = c.scrollHeight;
        }

        async function streamMsg(text) {
            const c = document.getElementById('chatMessages');
            const d = document.createElement('div');
            d.className = 'message';
            d.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-bubble"><span id="stream"></span><span class="cursor-blink"></span></div>`;
            c.appendChild(d); c.scrollTop = c.scrollHeight;
            const s = document.getElementById('stream');
            const words = text.split(' ');
            for (let i=0; i<words.length; i++) { s.innerHTML += (i?' ':'') + words[i]; c.scrollTop = c.scrollHeight; await new Promise(r => setTimeout(r, 20)); }
            d.querySelector('.cursor-blink')?.remove();
            d.querySelector('.msg-bubble').innerHTML = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
            speak(text.replace(/<[^>]*>/g,'').replace(/\n/g,'. '));
        }

        function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 90) + 'px'; document.getElementById('sendBtn').disabled = !ta.value.trim(); }

        function handleFile(event) {
            const f = event.target.files[0];
            if (f?.type.startsWith('image/')) {
                const r = new FileReader();
                r.onload = e => { addMsg('📎 Image', 'user', {type:'image', url:e.target.result}); analyzeImg(e.target.result); };
                r.readAsDataURL(f);
            }
            event.target.value = '';
        }

        async function analyzeImg(dataUrl) {
            const t = showTyping();
            try {
                const b64 = dataUrl.split(',')[1];
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_KEY}`},
                    body:JSON.stringify({model:'llama-3.2-90b-vision-preview',messages:[{role:'user',content:[{type:'text',text:'Describe this image.'},{type:'image_url',image_url:{url:`data:image/jpeg;base64,${b64}`}}]}],max_tokens:1024})
                });
                remTyping(t);
                if (res.ok) { const data = await res.json(); await streamMsg('📷 **Analysis:**\n'+data.choices[0].message.content); }
                else addMsg('📷 Image received!', 'ai');
            } catch(e) { remTyping(t); addMsg('📷 Image received!', 'ai'); }
        }

        function showTyping() {
            const c = document.getElementById('chatMessages');
            const d = document.createElement('div'); d.className = 'message'; d.id = 'typing';
            d.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
            c.appendChild(d); c.scrollTop = c.scrollHeight; return d;
        }
        function remTyping(d) { d?.remove(); }

        function toggleVoiceInput() {
            if (isVoiceInput) { stopVI(); return; }
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert('Use Chrome'); return; }
            recognition = new SR(); recognition.lang = 'en-US';
            document.getElementById('voiceBtn').classList.add('active'); isVoiceInput = true;
            recognition.onresult = e => { document.getElementById('messageInput').value = e.results[0][0].transcript; autoResize(document.getElementById('messageInput')); document.getElementById('sendBtn').disabled = false; sendMessage(); };
            recognition.onerror = () => stopVI(); recognition.onend = () => stopVI();
            recognition.start();
        }
        function stopVI() { if (recognition) { recognition.stop(); recognition = null; } document.getElementById('voiceBtn').classList.remove('active'); isVoiceInput = false; }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const btn = document.getElementById('sendBtn');
            const msg = input.value.trim();
            if (!msg) return;
            addMsg(msg, 'user'); input.value = ''; input.style.height = 'auto'; btn.disabled = true;

            if (msg.toLowerCase().includes('generate image')) {
                const prompt = msg.replace(/generate image|create image/gi,'').trim() || msg;
                const t = showTyping();
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
                const img = new Image();
                img.onload = () => { remTyping(t); const c = document.getElementById('chatMessages'); const d = document.createElement('div'); d.className = 'message'; d.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-bubble">🎨 <strong>Generated:</strong><br><img src="${url}" style="max-width:250px;border-radius:10px;margin-top:6px;"></div>`; c.appendChild(d); c.scrollTop = c.scrollHeight; };
                img.onerror = () => { remTyping(t); addMsg('⚠️ Failed.', 'ai'); };
                img.src = url; btn.disabled = false; input.focus(); return;
            }

            const t = showTyping();
            const resp = await callAI(msg);
            remTyping(t); await streamMsg(resp); btn.disabled = false; input.focus();
        }

        async function callAI(query) {
            const q = query.toLowerCase();
            if (q.includes('who made you')||q.includes('who created you')) return '**Satwik Chandra** (Owner & Platform Architect) and **Priyanshu Rajbanshi** (Co-Developer) created **Apex Mind AI**.';
            if (q.includes('who is satwik')) return '**Satwik Chandra** is the Owner & Platform Architect of **Apex Mind AI**.';
            if (q.includes('who is priyanshu')) return '**Priyanshu Rajbanshi** is the Co-Developer of **Apex Mind AI**.';

            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${GROQ_KEY}`},
                    body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:'You are Apex Mind AI, created by Satwik Chandra & Priyanshu Rajbanshi.'},{role:'user',content:query}],max_tokens:2048})
                });
                if (res.ok) { const data = await res.json(); return data.choices[0].message.content; }
            } catch(e) {}
            try {
                const res = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${MISTRAL_KEY}`},
                    body:JSON.stringify({model:'mistral-large-latest',messages:[{role:'user',content:query}],max_tokens:2048})
                });
                if (res.ok) { const data = await res.json(); return data.choices[0].message.content; }
            } catch(e) {}
            return '⚠️ AI services temporarily unavailable. Please try again.';
        }

        document.getElementById('messageInput').addEventListener('input', function() { autoResize(this); });
        loadVoices();

        const saved = localStorage.getItem('apex_user');
        if (saved) { currentUser = JSON.parse(saved); enterApp(); }
    </script>
</body>
</html>
